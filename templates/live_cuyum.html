<body>
  <main class="cuyum-live">
    <aside class="readout" aria-live="polite">
      <header class="brand-bar">
        <a
          class="brand-link"
          href="/web"
          title="Ir al sitio de Cuyum"
          aria-label="Ir al sitio web de Cuyum"
        >
          <img src="/static/cuyum_logo_v2.webp?v=2" alt="" class="brand-mark">
          <div class="brand-copy">
            <strong>Cuyum</strong>
            <span>red experimental</span>
          </div>
        </a>
        <button id="audioButton" class="audio-button" type="button">Audio</button>
      </header>

      <section id="stateCard" class="state-board state-normal" aria-label="Estado actual">
        <div class="state-line">
          <span class="state-label">Estado</span>
          <span id="lastUpdate" class="time-mark">--:--:--</span>
        </div>
        <div id="mainMessage" class="state-word">Conectando</div>
        <div id="statusHint" class="status-hint">esperando datos de Cuyum</div>
      </section>

      <section class="measure-board" aria-label="Red actual">
        <div class="measure-title">Red actual</div>
        <div class="measure-row plain-measure">
          <span>Zonas</span>
          <b id="zonesCount">--</b>
        </div>
        <div class="measure-row plain-measure">
          <span>Sensores</span>
          <b id="sensorsCount">--</b>
        </div>
      </section>

      <section class="zones-board" aria-label="Zonas Cuyum">
        <div class="zones-head">
          <span>Zona</span>
          <span>Estado</span>
          <span>Sensores</span>
        </div>
        <div id="cellsList" class="zone-rows"></div>
      </section>
    </aside>

    <section class="map-panel" aria-label="Mapa de sensores Cuyum">
      <header class="map-head">
        <div>
          <h1>Mapa de cobertura</h1>
          <p>Sensores y zonas en servicio</p>
        </div>
        <button id="centerMapButton" class="map-button" type="button">Centrar mapa</button>
      </header>

      <div class="coverage-map" id="mapBox" role="img" aria-label="Mapa de sensores y zonas">
        <div id="leafletMap"></div>
        <div id="mapEmpty" class="map-empty hidden">Esperando ubicación de sensores...</div>
      </div>

      <footer class="map-footer">
        <a
          class="raw-json-link"
          href="http://contenidos.inpres.gob.ar/sismologia/xultimos"
          target="_blank"
          rel="noopener noreferrer"
        >🏛️ Ver INPRES</a>
        <a class="raw-json-link" href="/json" target="_blank" rel="noopener">📍 Estado actual</a>
        <a class="raw-json-link" href="/reg" target="_blank" rel="noopener">📦 Registros recientes</a>
      </footer>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/live_cuyum.js?v=app-ui-v3"></script>
</body>
</html>
